spring.application.name=CoWorkHub

spring.datasource.url=jdbc:mysql://localhost:3308/coworking?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# Evita el problema N+1: carga relaciones LAZY por lotes
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT (el secreto se puede sobrescribir con la variable de entorno JWT_SECRET)
app.jwt.secret=${JWT_SECRET:coworkhub-dev-secret-change-me-0123456789}
app.jwt.expiration-minutes=60